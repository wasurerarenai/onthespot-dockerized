name: Sync Fork (beta)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: fastapi-rolling
          fetch-depth: 0

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/ots-downloader/onthespot.git
          git fetch upstream fastapi-rolling

      - name: Sync with upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout fastapi-rolling
          git merge upstream/fastapi-rolling --ff-only
          git push origin fastapi-rolling
